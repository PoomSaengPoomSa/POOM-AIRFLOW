name: Deploy POOM-AIRFLOW
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/poomsaengpoomsa/poom-airflow:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy docker-compose to Airflow server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AIRFLOW_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-airflow.yml"
          target: "/opt/airflow"
      - name: Deploy to Airflow server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AIRFLOW_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u poomsaengpoomsa --password-stdin
            cd /opt/airflow
            docker compose -f docker-compose-airflow.yml --env-file .env pull
            docker compose -f docker-compose-airflow.yml --env-file .env up -d
